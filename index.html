<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fasten-Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
    }
    .bg {
      height: 100%;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      transition: background-image 0.5s ease-in-out;
    }
    .card {
      background: rgba(0, 0, 0, 0.5);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      max-width: 90%;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.25rem;
    }
  </style>
</head>
<body>

  <div class="bg" id="bg">
    <div class="card">
      <h1 id="day-title">Lade...</h1>
      <p id="status-text"></p>
    </div>
  </div>

  <script>
    const days = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
    
    // Bilder-URLs
    const imgSky = "https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?auto=format&fit=crop&w=1000&q=80"; // Fasten
    const imgFruit = "https://images.unsplash.com/photo-1610832958506-aa56368176cf?auto=format&fit=crop&w=1000&q=80"; // Essen
    const imgSun = "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=80"; // Sonntag (Sonne)

    const today = new Date().getDay();
    const bgElement = document.getElementById("bg");
    const titleElement = document.getElementById("day-title");
    const statusElement = document.getElementById("status-text");

    titleElement.textContent = days[today];

    switch(today) {
      case 0: // Sonntag
        bgElement.style.backgroundImage = `url('${imgSun}')`;
        statusElement.textContent = "Spezialtag ☀️";
        break;
      case 1: // Montag
      case 3: // Mittwoch
      case 5: // Freitag
        bgElement.style.backgroundImage = `url('${imgSky}')`;
        statusElement.textContent = "Fastentag ☁️";
        break;
      default: // Dienstag, Donnerstag, Samstag
        bgElement.style.backgroundImage = `url('${imgFruit}')`;
        statusElement.textContent = "Essenstag 🍏";
    }
  </script>
</body>
</html>
